<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Recordatorio de Danna y Miguel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danna y Miguel">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:#0b1d3a; color:white;
    transition: background-color 0.25s ease;
  }
  #reposo {
    height:100%; width:100%; padding: 0 16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center;
  }
  #reposo h1 { font-size: clamp(1.4rem, 6vmin, 3em); margin-bottom:0.2em; }
  #reloj { font-size: clamp(1.1rem, 4.5vmin, 2.2em); opacity:0.85; }
  #fecha { font-size: clamp(0.8rem, 2.8vmin, 1.3em); opacity:0.6; margin-top:10px; }

  #alarma {
    display:none;
    height:100%; width:100%; padding: 0 16px;
    text-align:center;
    align-items:center; justify-content:center; flex-direction:column;
  }
  #alarma img {
    max-width:55%; max-height:30vh;
    border-radius: 24px;
    border: 8px solid white;
    margin-bottom: 25px;
    object-fit: cover;
  }
  #mensaje {
    font-size: clamp(1.4rem, 6.5vmin, 3.4em); font-weight:bold;
    margin: 10px 0; line-height:1.2; max-width:100%;
    overflow-wrap: break-word;
  }
  #dosis { font-size: clamp(1rem, 3.8vmin, 1.9em); margin-bottom: 40px; opacity:0.9; }
  #confirmar {
    font-size: clamp(1.1rem, 4.5vmin, 2.6em); padding: 4vmin 8vmin; border-radius: 30px;
    border:none; background:#1abc54; color:white; font-weight:bold;
    cursor:pointer; box-shadow: 0 6px 0 #0e7d38; max-width:90vw;
  }
  #confirmar:active { transform: translateY(4px); box-shadow: 0 2px 0 #0e7d38; }

  #iniciar {
    position:fixed; bottom:16px; right:16px; opacity:0.2; font-size:0.9em;
    padding:12px 22px; border-radius:10px; border:none; background:#333; color:white;
    max-width: 45vw;
  }

  #pausar {
    position:fixed; bottom:16px; left:16px; opacity:0.2; font-size:0.9em;
    padding:12px 22px; border-radius:10px; border:none; background:#333; color:white;
  }
  body.pausada #pausar { opacity:0.9; background:#c0392b; }

  #estado-pausa {
    display:none; font-size: clamp(0.9rem, 3vmin, 1.4em); margin-top:20px; opacity:0.7;
  }
  body.pausada #estado-pausa { display:block; }
  body.pausada #reloj, body.pausada #fecha { opacity:0.25; }

  .flash-a { background:#e2231a !important; }
  .flash-b { background:#ffcc00 !important; color:#111; }
</style>
</head>
<body>

  <div id="reposo">
    <h1>💊 Recordatorio de Danna y Miguel</h1>
    <div id="reloj"></div>
    <div id="fecha"></div>
    <div id="estado-pausa">⏸ App en pausa — pulsa "Reanudar" para volver a activarla</div>
  </div>

  <div id="alarma">
    <img id="alarma-img" src="" alt="medicamento">
    <div id="mensaje"></div>
    <div id="dosis"></div>
    <button id="confirmar">✅ YA LO TOMÉ</button>
  </div>

  <button id="iniciar">🔊 Activar sonido (tocar una vez al encender)</button>
  <button id="pausar"></button>

<script>
  // *** PEGA AQUÍ LA URL DE TU WEB APP DE APPS SCRIPT (termina en /exec) ***
  // Ver apps-script/Code.gs para el backend con el horario de Danna y Miguel.
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBJKebIHVUPhLTHvpPpN7HovsoCxhejbR3wkUoPDrHrSXdxbbTUIbQuDaz4ngmdXz9_g/exec";

  let vozActiva = false;
  let alarmaActualId = null;
  let flashInterval = null;
  let revisionInterval = null;
  let vozInterval = null;
  let appPausada = localStorage.getItem('appPausada') === 'true';

  function actualizarBotonPausa() {
    document.getElementById('pausar').textContent = appPausada ? '▶ Reanudar' : '⏸ Pausar';
    document.body.classList.toggle('pausada', appPausada);
  }

  function togglePausa() {
    appPausada = !appPausada;
    localStorage.setItem('appPausada', appPausada);
    actualizarBotonPausa();
    if (appPausada) {
      ocultarAlarma();
      if (revisionInterval) { clearInterval(revisionInterval); revisionInterval = null; }
    } else {
      revisarAlarmas();
      if (!revisionInterval) revisionInterval = setInterval(revisarAlarmas, 20000);
    }
  }

  document.getElementById('pausar').addEventListener('click', togglePausa);
  actualizarBotonPausa();

  document.getElementById('iniciar').addEventListener('click', () => {
    const u = new SpeechSynthesisUtterance("Sistema de recordatorios activado");
    u.lang = 'es-MX';
    speechSynthesis.speak(u);
    vozActiva = true;
    document.getElementById('iniciar').style.display = 'none';
    activarWakeLock();
  });

  let wakeLock = null;
  async function activarWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock liberado, se intentará de nuevo si vuelve a estar visible');
        });
      }
    } catch (err) {
      console.error('No se pudo activar wake lock:', err);
    }
  }

  // Si Android libera el wake lock (ej. al volver de estar oculta), se vuelve a pedir
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && vozActiva) {
      activarWakeLock();
    }
  });

  function actualizarReloj() {
    const ahora = new Date();
    document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'});
  }
  setInterval(actualizarReloj, 1000);
  actualizarReloj();

  function hablar(texto) {
    if (!vozActiva) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-MX';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }

  function mostrarAlarma(alarma) {
    document.getElementById('reposo').style.display = 'none';
    const div = document.getElementById('alarma');
    div.style.display = 'flex';
    document.getElementById('alarma-img').src = alarma.imagen_url || '';
    document.getElementById('mensaje').textContent = alarma.mensaje_voz;
    document.getElementById('dosis').textContent = alarma.dosis || '';

    if (alarmaActualId !== alarma.id) {
      alarmaActualId = alarma.id;
      if (vozInterval) clearInterval(vozInterval);
      hablar(alarma.mensaje_voz);
      vozInterval = setInterval(() => hablar(alarma.mensaje_voz), 15000);
    }

    if (!flashInterval) {
      let toggle = false;
      flashInterval = setInterval(() => {
        document.body.className = toggle ? 'flash-a' : 'flash-b';
        toggle = !toggle;
      }, 500);
    }

    document.getElementById('confirmar').onclick = () => confirmar(alarma.fila);
  }

  function ocultarAlarma() {
    document.getElementById('alarma').style.display = 'none';
    document.getElementById('reposo').style.display = 'flex';
    document.body.classList.remove('flash-a', 'flash-b');
    clearInterval(flashInterval);
    flashInterval = null;
    if (vozInterval) { clearInterval(vozInterval); vozInterval = null; }
    alarmaActualId = null;
  }

  function confirmar(fila) {
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ fila: fila })
    }).then(() => {
      ocultarAlarma();
      revisarAlarmas();
    }).catch(err => console.error('Error confirmando:', err));
  }

  function revisarAlarmas() {
    if (appPausada) return;
    fetch(SCRIPT_URL)
      .then(r => r.json())
      .then(data => {
        if (data.alarmas && data.alarmas.length > 0) {
          const alarma = data.alarmas.sort((a,b) => b.minutos_retraso - a.minutos_retraso)[0];
          mostrarAlarma(alarma);
        } else {
          ocultarAlarma();
        }
      })
      .catch(err => console.error('Error consultando alarmas:', err));
  }

  if (!appPausada) {
    revisarAlarmas();
    revisionInterval = setInterval(revisarAlarmas, 20000);
  }
</script>

</body>
</html>
